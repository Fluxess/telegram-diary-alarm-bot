<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Личный Дневник & Будильник</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #58a6ff;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
      --success-color: #238636;
      --danger-color: #da3633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-greeting h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .user-greeting p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .date-badge {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-color);
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      transition: transform 0.15s ease;
    }

    .task-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-info {
      flex-grow: 1;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #e3b341;
      font-weight: 500;
    }

    .diary-card {
      border-left: 4px solid #a855f7;
    }

    .diary-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .mood-badge {
      font-size: 16px;
    }

    .gratitude-block {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(168, 85, 247, 0.1);
      border-radius: 8px;
      font-size: 13px;
      color: #d8b4fe;
    }

    /* FAB Button */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.4);
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      fill: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="user-greeting">
      <h1 id="user-name">Привет 👋</h1>
      <p>Твой личный ритм и фокус</p>
    </div>
    <div class="date-badge" id="current-date">Сегодня</div>
  </header>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('tasks')">⏰ Задачи & Будильники</button>
    <button class="tab-btn" onclick="switchTab('diary')">📖 Дневник дня</button>
  </div>

  <!-- Вкладка Дел -->
  <div id="tasks-tab" class="tab-content active">
    <div id="tasks-list">
      <div class="empty-state">
        <p>Загрузка расписания...</p>
      </div>
    </div>
  </div>

  <!-- Вкладка Дневника -->
  <div id="diary-tab" class="tab-content">
    <div id="diary-list">
      <div class="empty-state">
        <p>Загрузка записей дневника...</p>
      </div>
    </div>
  </div>

  <button class="fab-btn" onclick="openCreateModal()">+</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const user = tg.initDataUnsafe?.user || { id: 1, first_name: "Друг" };
    document.getElementById('user-name').innerText = `Привет, ${user.first_name} 👋`;

    const now = new Date();
    document.getElementById('current-date').innerText = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(tab === 'tasks') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tasks-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('diary-tab').classList.add('active');
      }
    }

    async function loadData() {
      try {
        const res = await fetch(`/api/user_data?user_id=${user.id}`);
        const data = await res.json();
        renderTasks(data.tasks || []);
        renderDiary(data.diary || []);
      } catch (err) {
        console.error(err);
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById('tasks-list');
      if (!tasks.length) {
        container.innerHTML = `
          <div class="empty-state">
            <p>На сегодня нет активных дел или будильников.</p>
            <p style="font-size:12px; margin-top:6px;">Нажмите +, чтобы добавить!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = tasks.map(t => `
        <div class="card task-card">
          <div class="task-checkbox" onclick="toggleTask(${t.id})">
            ${t.is_completed ? '✓' : ''}
          </div>
          <div class="task-info">
            <div class="task-title ${t.is_completed ? 'completed' : ''}">${t.title}</div>
            <div class="task-time">⏰ ${t.due_datetime}</div>
          </div>
        </div>
      `).join('');
    }

    function renderDiary(entries) {
      const container = document.getElementById('diary-list');
      if (!entries.length) {
        container.innerHTML = `
          <div class="empty-state">
            <p>В дневнике пока нет записей.</p>
            <p style="font-size:12px; margin-top:6px;">Поделись мыслями или итогами дня через бота!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = entries.map(e => `
        <div class="card diary-card">
          <div class="diary-meta">
            <span>📅 ${e.date}</span>
            <span class="mood-badge">${e.mood || '✨'}</span>
          </div>
          <div style="font-size:14px; line-height:1.4;">${e.notes}</div>
          ${e.gratitude ? `<div class="gratitude-block">🙏 Благодарность: ${e.gratitude}</div>` : ''}
        </div>
      `).join('');
    }

    async function toggleTask(taskId) {
      await fetch(`/api/complete_task?task_id=${taskId}`, { method: 'POST' });
      loadData();
    }

    function openCreateModal() {
      tg.sendData(JSON.stringify({ action: "create_task_prompt" }));
      tg.close();
    }

    loadData();
  </script>
</body>
</html>
